# ───── L2 BU 流程概觀 ─────
process_overview: |
  [TODO:核實] 產險主要業務流程:
  1. 核保線:報價 → 核保 → 出單 → 續保
     - 個火 / 個人車險:標準規則,系統自動核保比例高
     - 商火 / 高保額:個案核保,需人工判斷標的物風險
  2. 理賠線:報案受理 → 勘查 → 文件審核 → 理算 → 給付
     - 文件型別多(警政紀錄、醫療單據、車禍照片、修理估價單 ...)
     - 部分文件由保戶上傳、部分由 client 端業務員協助
  3. 續保 / 加退保:續保提醒、保單變更、退費計算

