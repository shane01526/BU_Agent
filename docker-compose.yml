services:
  postgres:
    image: postgres:15-alpine
    container_name: bu_agent_postgres
    environment:
      POSTGRES_USER: bu_agent
      POSTGRES_PASSWORD: bu_agent
      POSTGRES_DB: bu_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bu_agent -d bu_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bu_agent_backend
    # env_file 讓 .env 內容直接灌進容器,避開 host shell env 蓋掉 ${VAR:-}
    # 的問題（例:OPENAI_API_KEY 在 Windows 系統環境變數已有舊值會覆寫 .env）
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bu_agent:bu_agent@postgres:5432/bu_agent
      LANGGRAPH_CHECKPOINT_URL: postgresql://bu_agent:bu_agent@postgres:5432/bu_agent
      APP_ENV: ${APP_ENV:-prod}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "/app/scripts/entrypoint.sh"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bu_agent_frontend
    environment:
      # 瀏覽器走同源 /api 經 Next.js rewrites 代理；
      # SSE 在 sse.ts 中 runtime 從 window.location.hostname 推 backend，無需 build-time env
      NEXT_PUBLIC_API_BASE: ""
      # Next.js server-side proxy 在 container 內連 backend service name
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_AUTH_MODE: mock
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
